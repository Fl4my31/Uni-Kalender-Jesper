name: Update Family Calendar

on:
  schedule:
    - cron: '0 4 * * *' # Läuft jeden Tag um 4:00 Uhr morgens
  workflow_dispatch: # Erlaubt auch den manuellen Start über einen Button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install icalendar requests pytz

      - name: Run Skript
        run: python script.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add familien_uni.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated calendar update" && git push)
